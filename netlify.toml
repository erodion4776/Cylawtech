[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# All API calls now go to Supabase Edge Functions
[[redirects]]
  from = "/api/chat"
  to = "https://YOUR_PROJECT_ID.supabase.co/functions/v1/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/*"
  to = "https://YOUR_PROJECT_ID.supabase.co/functions/v1/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/embed"
  to = "https://YOUR_PROJECT_ID.supabase.co/functions/v1/embed"
  status = 200
  force = true

# SPA catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow embedding the standalone widget
[[headers]]
  for = "/lex-ai-embed"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
    Access-Control-Allow-Origin = "*"
