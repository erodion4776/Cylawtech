name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Lets you click "Run workflow" manually from GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Chat Function
        run: |
          supabase functions deploy chat --project-ref utevbbyriqhnxhoipljv --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
